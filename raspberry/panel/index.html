<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8457a">
<title>Fotos del cumple de Mailen</title>
<style>
:root{--bg:#fff7fa;--fg:#2b1d24;--card:#fff;--pri:#e8457a;--pri2:#c92e62;--mut:#8a7480;--line:#f1dbe4;--ok:#1f9d55;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#1b1417;--fg:#f7eaf0;--card:#271d22;--mut:#b49aa6;--line:#3a2b32}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:max(18px,env(safe-area-inset-top)) 16px 10px;text-align:center}
h1{font-size:1.45rem;margin:0}
.sub{color:var(--mut);margin:4px 0 0;font-size:.95rem}
#rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;padding:10px 12px 40px;max-width:900px;margin:0 auto}
#rejilla button{border:0;padding:0;margin:0;background:var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9;cursor:pointer;position:relative}
#rejilla img{width:100%;height:100%;object-fit:cover;display:block}
#rejilla .nueva::after{content:"¡nueva!";position:absolute;top:6px;left:6px;background:var(--pri);color:#fff;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:99px}
#vacio{text-align:center;color:var(--mut);padding:40px 20px}
#visor{position:fixed;inset:0;background:#0d090b;display:none;flex-direction:column;z-index:10}
#visor.on{display:flex}
#visor .arriba{display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 6px;color:#eee}
#cerrar{background:none;border:0;color:#fff;font-size:1.9rem;line-height:1;padding:6px 10px;cursor:pointer}
#marco{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;touch-action:pan-y}
#grande{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default;user-select:auto}
.flecha{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;font-size:1.6rem;width:44px;height:64px;border-radius:12px;cursor:pointer}
#ant{left:6px}#sig{right:6px}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px max(14px,env(safe-area-inset-bottom))}
.acciones button,.acciones a{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 6px;text-align:center;text-decoration:none;color:#fff;background:#3a2b32;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.acciones .ico{font-size:1.4rem}
.acciones .pri{background:linear-gradient(135deg,var(--pri),var(--pri2))}
.acciones .seguro{background:var(--ok)}
.acciones button:disabled{opacity:.45}
#pista{display:none;margin:0 12px;background:#fff3cd;color:#5c4300;border-radius:12px;padding:10px 12px;font-size:.92rem}
#pista.on{display:block}
#aviso{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b1d24;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#aviso.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📸 Fotos del cumple de Mailen</h1>
  <p class="sub">Toca una foto para guardarla, mandarla por WhatsApp o imprimirla</p>
</header>
<div id="rejilla"></div>
<div id="vacio">Todavía no hay fotos… ¡ve al photomatón! 🎉</div>

<div id="visor" role="dialog" aria-modal="true">
  <div class="arriba"><span id="contador"></span><button id="cerrar" aria-label="Cerrar">×</button></div>
  <div id="marco">
    <img id="grande" alt="Foto del photomatón">
    <button class="flecha" id="ant" aria-label="Anterior">‹</button>
    <button class="flecha" id="sig" aria-label="Siguiente">›</button>
  </div>
  <p id="pista"></p>
  <div class="acciones">
    <button id="bCompartir" class="pri"><span class="ico">📲</span>Compartir</button>
    <a id="bGuardar" download><span class="ico">⬇️</span>Guardar</a>
    <button id="bImprimir"><span class="ico">🖨</span><span id="tImprimir">Imprimir</span></button>
  </div>
</div>
<div id="aviso"></div>

<script>
const $=id=>document.getElementById(id);
let fotos=[], vistas=null, actual=-1, puedeImprimir=true, confirmar=null;

function aviso(t,ms=3500){const a=$("aviso");a.textContent=t;a.classList.add("on");clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove("on"),ms)}

async function cargar(){
  try{
    const r=await fetch("/api/fotos",{cache:"no-store"}); const d=await r.json();
    puedeImprimir=d.imprimir; $("bImprimir").style.display=puedeImprimir?"":"none";
    document.querySelector(".acciones").style.gridTemplateColumns=puedeImprimir?"repeat(3,1fr)":"repeat(2,1fr)";
    const nuevas=vistas?d.fotos.filter(n=>!vistas.has(n)):[];
    if(vistas && nuevas.length===0 && d.fotos.length===fotos.length) return;
    const ant=fotos[actual]; fotos=d.fotos; if(ant) actual=fotos.indexOf(ant);
    pintar(new Set(nuevas)); vistas=new Set(fotos);
  }catch{}
}
function pintar(nuevas){
  $("vacio").style.display=fotos.length?"none":"";
  $("rejilla").innerHTML=fotos.map((n,i)=>`<button data-i="${i}" class="${nuevas.has(n)?"nueva":""}"><img loading="lazy" src="/mini/${n}" alt="Foto ${fotos.length-i}"></button>`).join("");
}
$("rejilla").onclick=e=>{const b=e.target.closest("button");if(b)abrir(+b.dataset.i)};

function abrir(i){
  if(i<0||i>=fotos.length) return;
  actual=i; const n=fotos[i];
  $("grande").src="/foto/"+n;
  $("bGuardar").href="/foto/"+n+"?descargar=1";
  $("bGuardar").setAttribute("download","photomaton-mailen-"+n);
  $("contador").textContent=`Foto ${fotos.length-i} de ${fotos.length}`;
  $("ant").style.visibility=i>0?"":"hidden"; $("sig").style.visibility=i<fotos.length-1?"":"hidden";
  $("pista").classList.remove("on"); resetImprimir();
  if(!$("visor").classList.contains("on")){$("visor").classList.add("on");history.pushState({visor:1},"")}
}
function cerrar(){$("visor").classList.remove("on");resetImprimir()}
$("cerrar").onclick=()=>history.back();
addEventListener("popstate",cerrar);
$("ant").onclick=()=>abrir(actual-1); $("sig").onclick=()=>abrir(actual+1);
addEventListener("keydown",e=>{if(!$("visor").classList.contains("on"))return;if(e.key==="ArrowLeft")abrir(actual-1);if(e.key==="ArrowRight")abrir(actual+1);if(e.key==="Escape")history.back()});
let x0=null; $("marco").addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
$("marco").addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)abrir(actual+(dx<0?1:-1))});

// Compartir: con el menú del móvil si el navegador lo permite; si no (página sin https), explicamos el gesto
const esIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
$("bCompartir").onclick=async()=>{
  const n=fotos[actual];
  try{
    if(navigator.canShare){
      const blob=await (await fetch("/foto/"+n)).blob();
      const f=new File([blob],"photomaton-mailen-"+n,{type:"image/jpeg"});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Cumple de Mailen"});return}
    }
  }catch(e){if(e.name==="AbortError")return}
  $("pista").innerHTML=esIOS
    ?"👆 <b>Mantén pulsada la foto</b> y elige <b>Compartir</b> → WhatsApp. O pulsa <b>Guardar</b> y mándala desde Fotos."
    :"👆 <b>Mantén pulsada la foto</b> y elige <b>Compartir imagen</b> → WhatsApp. O pulsa <b>Guardar</b> y mándala desde la galería.";
  $("pista").classList.add("on");
};

// Imprimir: hay que pulsar dos veces para evitar copias sin querer
function resetImprimir(){clearTimeout(confirmar);confirmar=null;$("tImprimir").textContent="Imprimir";$("bImprimir").classList.remove("seguro");$("bImprimir").disabled=false}
$("bImprimir").onclick=async()=>{
  if(!confirmar){$("tImprimir").textContent="¿Seguro? Toca otra vez";$("bImprimir").classList.add("seguro");confirmar=setTimeout(resetImprimir,4000);return}
  resetImprimir(); $("bImprimir").disabled=true;
  try{
    const r=await fetch("/api/imprimir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({foto:fotos[actual]})});
    const d=await r.json(); aviso((d.ok?"🖨 ":"⚠️ ")+d.msg,5000);
  }catch{aviso("⚠️ No se ha podido contactar con el photomatón")}
  setTimeout(()=>{$("bImprimir").disabled=false},3000);
};

cargar(); setInterval(()=>{if(document.visibilityState==="visible")cargar()},8000);
</script>
</body>
</html>
