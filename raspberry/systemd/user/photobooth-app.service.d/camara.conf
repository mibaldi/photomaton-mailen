[Service]
# Ajustes de la Logitech C920 al arrancar la app (cambia el id por el de tu cámara: ls /dev/v4l/by-id/)
ExecStartPre=-/usr/bin/v4l2-ctl -d /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_XXXXXXXX-video-index0 -c power_line_frequency=1 -c brightness=140 -c saturation=140 -c contrast=128 -c backlight_compensation=1 -c auto_exposure=3 -c exposure_dynamic_framerate=1
